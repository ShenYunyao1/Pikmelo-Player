name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Restore signing identity
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.p12"
          printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
            "$RUNNER_TEMP/release.p12" "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > "$RUNNER_TEMP/signing.properties"
          echo "PIKMELO_SIGNING_PROPERTIES=$RUNNER_TEMP/signing.properties" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --split-per-abi
      - name: Prepare verified release assets
        run: python3 tools/prepare_release.py --tag "${GITHUB_REF_NAME}" --output build/release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: build/release-assets/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows build
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content pubspec.yaml -Raw), '(?m)^version:\s*([^+]+)\+').Groups[1].Value.Trim()
          New-Item -ItemType Directory -Path build/release-assets -Force | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "build/release-assets/Pikmelo-Player-$version-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/release-assets/*

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          merge-multiple: true
          path: build/release-assets
      - run: python3 tools/finalize_release.py build/release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: build/release-assets/*
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            test "$(jq -r .isDraft "$RUNNER_TEMP/release.json")" = true
            gh release upload "$GITHUB_REF_NAME" build/release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/release-assets/* --verify-tag --draft \
              --title "Pikmelo Player $GITHUB_REF_NAME" --generate-notes
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
